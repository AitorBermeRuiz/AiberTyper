name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Self-check
        run: ./test.sh
      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh
      - name: Cask template
        run: scripts/test-cask.sh
