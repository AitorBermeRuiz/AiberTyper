name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Self-check
        run: src/mac/test.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: src/windows/go.mod
          cache-dependency-path: src/windows/go.mod
      # The Windows port shares the Mac rules through files generated from the Swift sources.
      - name: Windows shared files are up to date
        run: |
          src/mac/export-shared.sh
          git diff --exit-code src/windows/shared || { echo "Run src/mac/export-shared.sh and commit src/windows/shared."; exit 1; }
      - name: Windows logic tests
        run: src/windows/test.sh
      - name: Build universal app
        run: UNIVERSAL=1 src/mac/build.sh
      - name: Cask template
        run: install/test-cask.sh

  # Separate from `check` (the required check) until it proves stable on GitHub's virtual Macs.
  bench:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Benchmark (fails over budget)
        shell: bash # with pipefail, so tee keeps the benchmark's exit code
        run: src/mac/bench.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # The Windows app on a real Windows desktop: tests, build, then the end-to-end bench with screenshots.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: src/windows/go.mod
          cache-dependency-path: src/windows/go.mod
      - name: Logic tests
        shell: bash
        run: src/windows/test.sh
      - name: Build
        shell: bash
        run: VERSION=1.2.3 src/windows/build.sh
      # Code signing (SignPath) checks the product name and version, read here by Windows itself.
      - name: Version info
        shell: powershell
        run: |
          $v = (Get-Item build/windows/AiberTyper.exe).VersionInfo
          "$($v.ProductName) $($v.ProductVersion) $($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart)"
          if ($v.ProductName -ne 'AiberTyper' -or $v.ProductVersion -ne '1.2.3' -or $v.FileBuildPart -ne 3) { throw 'wrong version info' }
      - name: End-to-end bench (fails over budget)
        working-directory: src/windows
        shell: bash
        run: go run ./bench ../../build/windows/AiberTyper.exe ../../build/windows/shots | tee -a "$GITHUB_STEP_SUMMARY"
      # Windows PowerShell 5.1, what `irm … | iex` runs in on a fresh Windows.
      - name: Installer (per user, from the built zip)
        shell: powershell
        run: |
          Compress-Archive build/windows/AiberTyper.exe build/windows/AiberTyper-0.0.0-windows-x64.zip
          # The runner is an administrator: the first install runs with a basic-user token (runas /trustlevel),
          # where administrator rights are denied, so a step that needs them fails here.
          $zip = (Resolve-Path build/windows/AiberTyper-0.0.0-windows-x64.zip).Path
          $log = "$env:TEMP\install-basic-user.log"
          Set-Content "$env:TEMP\install-basic-user.ps1" @"
          `$admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          try { & '$((Resolve-Path install/install.ps1).Path)' -Zip '$zip' *> `$null; `$r = 'ok' } catch { `$r = "error: `$_" }
          "admin=`$admin `$r" | Set-Content '$log'
          "@
          runas /trustlevel:0x20000 "powershell -NoProfile -ExecutionPolicy Bypass -File $env:TEMP\install-basic-user.ps1"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $log); $i++) { Start-Sleep 1 }
          $result = Get-Content $log -ErrorAction SilentlyContinue
          "runner admin=$(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)), basic-user install: $result"
          if ($result -ne 'admin=False ok') { throw "install without administrator rights failed: $result" }
          $exe = "$env:LOCALAPPDATA\Programs\AiberTyper\AiberTyper.exe"
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Aiber Typer.lnk'
          if (-not (Test-Path $exe) -or -not (Test-Path $link)) { throw 'not installed' }
          Start-Sleep 2
          if (-not (Get-Process AiberTyper -ErrorAction SilentlyContinue)) { throw 'not running after install' }
          # Again over the running copy, as an update does: it is closed, replaced and opened.
          & ([scriptblock]::Create((Get-Content -Raw install/install.ps1))) -Zip build/windows/AiberTyper-0.0.0-windows-x64.zip
          Start-Sleep 2
          if (@(Get-Process AiberTyper -ErrorAction SilentlyContinue).Count -ne 1) { throw 'not running once after reinstall' }
          ./install/install.ps1 -Uninstall
          $left = "exe=$(Test-Path $exe) link=$(Test-Path $link) running=$([bool](Get-Process AiberTyper -ErrorAction SilentlyContinue))"
          if ($left -ne 'exe=False link=False running=False') { throw "not uninstalled: $left" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-screenshots
          path: build/windows/shots
      # The zip this run built and installed, to try it on a real PC: install.ps1 -Zip <file>.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-app
          path: build/windows/AiberTyper-0.0.0-windows-x64.zip
          retention-days: 14
