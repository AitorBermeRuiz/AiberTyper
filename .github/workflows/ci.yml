name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Self-check
        run: ./test.sh
      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh
      - name: Cask template
        run: ruby -c <(scripts/cask.sh 0.0.1 "$(printf '0%.0s' {1..64})" 0)
