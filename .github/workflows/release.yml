name: Release

# Push a tag like v0.2.0 to publish AiberTyper-0.2.0.zip (macOS) and AiberTyper-0.2.0-windows-x64.zip on GitHub Releases
# and update the Homebrew tap.
# Every secret is optional: without the Apple ones the app is ad-hoc signed and not notarized;
# without HOMEBREW_TAP_TOKEN the tap is not updated.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      CERT_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, to check the tag is on main

      - name: Tag is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "Tag $GITHUB_REF_NAME is not on main; tag origin/main instead."; exit 1; }

      - name: Version from tag
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP=AiberTyper-$version.zip" >> "$GITHUB_ENV"

      - name: Self-check
        run: src/mac/test.sh

      - name: Import Developer ID certificate
        if: env.CERT_P12 != '' && env.CERT_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$CERT_IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app
        run: UNIVERSAL=1 src/mac/build.sh

      - name: Zip
        run: ditto -c -k --keepParent build/AiberTyper.app "$ZIP"

      - uses: actions/setup-go@v6
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.mod

      # Cross-compiled here: the Windows app needs Go only.
      - name: Build Windows app
        run: |
          windows/build.sh
          echo "WINZIP=AiberTyper-$VERSION-windows-x64.zip" >> "$GITHUB_ENV"
          (cd build/windows && zip -q "../../AiberTyper-$VERSION-windows-x64.zip" AiberTyper.exe)

      - name: Notarize
        if: env.SIGN_IDENTITY != '' && env.NOTARY_APPLE_ID != '' && env.NOTARY_TEAM_ID != '' && env.NOTARY_PASSWORD != ''
        run: |
          xcrun notarytool submit "$ZIP" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          # Stapling fails unless Apple accepted the submission, which stops the release.
          xcrun stapler staple build/AiberTyper.app
          rm "$ZIP"
          ditto -c -k --keepParent build/AiberTyper.app "$ZIP"
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "SHA256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          windows="Windows: run \`irm https://raw.githubusercontent.com/AitorBermeRuiz/AitorTyper/main/scripts/install.ps1 | iex\` in PowerShell (no administrator rights needed)."
          if [[ "${NOTARIZED:-0}" == 1 ]]; then
            notes="Install with \`curl -fsSL https://raw.githubusercontent.com/AitorBermeRuiz/AitorTyper/main/scripts/install.sh | bash\` or see the README. You can also unzip it and move AiberTyper.app to Applications. $windows"
          else
            notes="Install with \`curl -fsSL https://raw.githubusercontent.com/AitorBermeRuiz/AitorTyper/main/scripts/install.sh | bash\` or see the README. This build is not notarized by Apple: if you download the zip with a browser, run \`xattr -dr com.apple.quarantine /Applications/AiberTyper.app\` after moving it to Applications. $windows"
          fi
          # A re-run after a failed tap update replaces the asset instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" "$WINZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" "$WINZIP" --title "AiberTyper $VERSION" --notes "$notes" --generate-notes
          fi

      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/AitorBermeRuiz/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          scripts/cask.sh "$VERSION" "$SHA256" "${NOTARIZED:-0}" > "$RUNNER_TEMP/tap/Casks/aibertyper.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The cask was aitortyper until 0.1.0: brew moves existing installs to the new token through cask_renames.json.
          { [ -f cask_renames.json ] && cat cask_renames.json || echo '{}'; } | jq '. + {"aitortyper": "aibertyper"}' > cask_renames.tmp
          mv cask_renames.tmp cask_renames.json
          git rm -q --ignore-unmatch Casks/aitortyper.rb
          git add Casks/aibertyper.rb cask_renames.json
          git diff --cached --quiet && exit 0 # already up to date (re-run)
          git commit -m "aibertyper $VERSION"
          git push
