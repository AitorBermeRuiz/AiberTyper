<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustes — pestañas en la barra</title>
<style>
:root{--bg:#1B1113;--fg:#F6EEF0;--pink:#F497A9;--neon:#E83A59;--muted:#AA989C;--muted-h:#D9CCD0;--border:#3C262B;--border-h:#7C5E66;--yellow:#F5D547;
--mono:ui-monospace,"SF Mono",Menlo,monospace;--ui:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;width:1100px;height:720px;background:var(--border);font-family:var(--ui);color:var(--fg);display:flex;align-items:center;justify-content:center}
.win{width:600px;background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
header{border-bottom:1px solid var(--border);padding:12px 16px 8px;background-image:radial-gradient(420px at 0 0,rgba(244,151,169,.22),transparent)}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;background:#3C262B}
.title{text-align:center;font:600 12px var(--mono);letter-spacing:2px;color:var(--pink);margin-top:-12px}
.tabs{display:flex;justify-content:center;gap:6px;margin-top:10px}
.tabs button{all:unset;cursor:pointer;width:84px;padding:6px 0;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted-h)}
.tabs button:hover{background:rgba(244,151,169,.15)}
.tabs button[aria-selected=true]{background:rgba(244,151,169,.18);color:var(--pink);font-weight:700}
.tabs svg{width:22px;height:22px}
button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
section{padding:20px 24px 24px}
.list{border:1px solid var(--border);border-radius:10px;padding:6px;max-height:250px;overflow:auto}
.item{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:6px;font-size:15px}
.item:hover{background:rgba(244,151,169,.15)}
.item.sel{background:var(--pink);color:var(--bg);font-weight:700}
.item .star{width:16px;color:var(--yellow)}.item.sel .star{color:var(--bg)}
.item .meta{margin-left:auto;font-size:12px;color:var(--muted)}.item.sel .meta{color:var(--bg)}
.item .src{font:11px var(--mono);border:1px solid var(--border-h);border-radius:3px;padding:1px 5px;color:var(--muted-h)}
.bar{display:flex;align-items:center;gap:10px;margin-top:14px}
.btn{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--border-h)}
.btn.p{background:var(--pink);color:var(--bg);border-color:var(--pink)}
.hint{margin-left:auto;font-size:12px;color:var(--muted)}
kbd{font:600 10px var(--ui);padding:1px 5px;border:1px solid rgba(170,152,156,.7);border-radius:4px;color:var(--muted-h)}
.err{font-size:12px;color:var(--neon);margin-top:10px}
</style>
</head>
<body>
<main class="win" aria-label="Ajustes de Aiber Typer">
  <header>
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title">COLECCIONES</div>
    <div class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h1M9 10h1M12 10h1M15 10h1M18 10h0M7 14h10"/></svg>General</button>
      <button role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/><path d="M6 9h2M16 9h2"/></svg>Colecciones</button>
      <button role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>Historial</button>
    </div>
  </header>
  <section role="tabpanel" aria-label="Colecciones">
    <div class="list" role="listbox" aria-label="Colección activa">
      <div class="item sel" role="option" aria-selected="true"><span class="star">★</span>Estoicismo<span class="meta">32 frases · activa</span></div>
      <div class="item" role="option"><span class="star">★</span>Programación<span class="meta">30 frases</span></div>
      <div class="item" role="option"><span class="star"></span>General<span class="meta">40 frases</span></div>
      <div class="item" role="option"><span class="star"></span>El arte de la guerra<span class="meta">30 frases</span></div>
      <div class="item" role="option"><span class="star"></span>Cine<span class="meta">30 frases</span></div>
      <div class="item" role="option"><span class="star"></span>Libros de culto<span class="meta">30 frases</span></div>
      <div class="item" role="option"><span class="star"></span>Rust <span class="src">rust.json</span><span class="meta">12 frases</span></div>
    </div>
    <div class="bar"><button class="btn p">Importar…</button><button class="btn">Abrir carpeta</button>
      <span class="hint"><kbd>F</kbd> favorito · <kbd>⌫</kbd> borrar importada</span></div>
    <p class="err">«notas.json» no se ha cargado: le faltan frases en inglés.</p>
  </section>
</main>
</body>
</html>
